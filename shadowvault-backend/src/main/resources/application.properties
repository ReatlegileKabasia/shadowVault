# Render provides PORT; use 8080 for local development.
server.port=${PORT:8080}

# Configure the local H2 Database
spring.datasource.url=jdbc:h2:mem:vaultdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable Hibernate to automatically create/update database tables from Java classes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console for browser debugging
spring.h2.console.enabled=true