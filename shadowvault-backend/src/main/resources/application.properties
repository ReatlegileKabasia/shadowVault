# Render provides PORT; use 8080 for local development.
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework

# Local development uses H2; production overrides these via the prod profile.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vaultdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Create/update database tables from Java classes.
spring.jpa.hibernate.ddl-auto=update

# Keep the H2 browser console disabled; it is not needed to run the app.
spring.h2.console.enabled=false

# Local development generates a temporary signing key when this is unset.
app.security.jwt-secret-base64=${JWT_SECRET_BASE64:}
app.security.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
app.security.auth-requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:20}
app.security.max-request-body-bytes=${MAX_REQUEST_BODY_BYTES:1048576}
app.security.max-rekey-body-bytes=${MAX_REKEY_BODY_BYTES:16777216}